name: LinkLog internal test tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linklog-internal-tunnel
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cloudflared
        run: |
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Host and monitor for up to six hours
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/linklog
          cleanup() {
            kill "${APP_PID:-}" "${TUNNEL_PID:-}" 2>/dev/null || true
            wait "${APP_PID:-}" "${TUNNEL_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > /tmp/linklog/tunnel.log 2>&1 &
          TUNNEL_PID=$!
          URL=""
          for i in $(seq 1 90); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat /tmp/linklog/tunnel.log
              exit 1
            fi
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/linklog/tunnel.log | head -n 1 || true)
            [[ -n "$URL" ]] && break
            sleep 2
          done
          if [[ -z "$URL" ]]; then
            cat /tmp/linklog/tunnel.log
            echo "Cloudflare tunnel URL not discovered" >&2
            exit 1
          fi
          export CF-HOST="${URL#https://}"
          export PORT=3000
          bun run start > /tmp/linklog/app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 45); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/linklog/app.log
              exit 1
            fi
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/ || { cat /tmp/linklog/app.log; exit 1; }
          echo "::notice title=LinkLog test URL::$URL"
          echo "## LinkLog internal test server" >> "$GITHUB_STEP_SUMMARY"
          echo "Public tunnel URL: **$URL**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary testing instance; URL expires when this run stops." >> "$GITHUB_STEP_SUMMARY"
          echo "LINKLOG_URL=$URL"
          deadline=$(( $(date +%s) + 6*60*60 - 5*60 ))
          while (( $(date +%s) < deadline )); do
            kill -0 "$APP_PID" 2>/dev/null || { echo "Application exited"; tail -80 /tmp/linklog/app.log; exit 1; }
            kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "Tunnel exited"; tail -80 /tmp/linklog/tunnel.log; exit 1; }
            echo "[$(date -u +%FT%TZ)] Live: $URL"
            sleep 60
          done
          echo "Testing window complete; shutting down cleanly."
